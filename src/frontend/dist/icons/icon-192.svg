<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="cross" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#e0e7ff" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="192" height="192" rx="40" fill="url(#bg)"/>
  <!-- Subtle inner glow -->
  <rect width="192" height="192" rx="40" fill="white" opacity="0.06"/>
  <!-- Medical cross -->
  <rect x="80" y="44" width="32" height="104" rx="10" fill="url(#cross)"/>
  <rect x="44" y="80" width="104" height="32" rx="10" fill="url(#cross)"/>
  <!-- MV monogram beneath -->
  <text x="96" y="174" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="18" fill="white" opacity="0.7" letter-spacing="2">MV</text>
</svg>
